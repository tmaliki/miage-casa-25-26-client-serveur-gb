<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 6</title>
</head>
<body>
    <h1>Exercice 6</h1>

    <script>
        const a = parseFloat(prompt("Entrez la valeur de a :"));
        const b = parseFloat(prompt("Entrez la valeur de b :"));

        if (a > b) { // a supérieur b
            alert("a est plus grand que b");
        } else if (a < b) { // a inférieur b
            alert("a est plus petit que b");
        } else { // a égal b
            alert("a et b sont égaux");
        }
    </script>
</body>
</html>
