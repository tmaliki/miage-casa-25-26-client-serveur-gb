<body>
    <h1>Exercice 10</h1>

    <script>
        function verifierAge(age) {
            if (age >= 18) {
               console.log("Accès autorisé.");
            } else {
                console.log("Accès interdit.");
            }
        }

        // test de la fonction
        const ageUtilisateur = parseInt(prompt("Veuillez entrer votre âge :"));
        verifierAge(ageUtilisateur);
    </script>
