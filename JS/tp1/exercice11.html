<body>
    <h1>Exercice 11</h1>

    <script>
        function estPairConditionTernaire(nbr) {
            return nbr % 2 === 0 ? "Pair." : "Impair.";
        }

        // test de la fonction
        const nombre = parseInt(prompt("Veuillez entrer un nombre :"));
        console.log(estPairConditionTernaire(nombre));
    </script>
