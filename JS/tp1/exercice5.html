<!DOCTYPE html>
<html lang="en">

    <title>Exercice 5</title>
</head>
<body>
    <h1>Exercice 5</h1>

    <script>
        function aireRectangle(long, larg) {
            return long * larg;
        }

        const longueur = parseFloat(prompt("Entrez la longueur du rectangle :"));
        const largeur = parseFloat(prompt("Entrez la largeur du rectangle :"));
        const aire = aireRectangle(longueur, largeur);

        // Affichage du résultat
        alert("L'aire du rectangle est : " + aire);
        console.log("L'aire du rectangle est : " + aire);
    </script>
</body>
</html>
