<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 13</title>
</head>
<body>
    <h1>Exercice 13</h1>

    <script>
        const jour = parseInt(prompt("Saisissez un numéro de jour entre 1-7 : "))

        switch (jour) {
            case 1:
                console.log("Lundi");
                break;

            case 2:
                console.log("Mardi");
                break;

            case 3:
                console.log("Mercredi");
                break;

            case 4:
                console.log("Jeudi");
                break;

            case 5:
                console.log("Vendredi");
                break;

            case 6:
                console.log("Samedi");
                break;

            case 7:
                console.log("Dimanche");
                break;

            default:
                console.log("Numéro de jour invalide. Veuillez saisir un numéro entre 1 et 7.");
        }
    </script>
</body>
</html>
