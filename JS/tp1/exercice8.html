<body>
    <h1>Exercice 8</h1>

    <script>
        function estPair(nbr) {
            if (nbr % 2 === 0) {
                return "Le nombre " + nbr + " est pair.";
            } else {
                return `Le nombre ${nbr} est impair.`;
            }
        }

        // Test de la fonction
        const nombre = parseInt(prompt("Entrez un nombre entier :"));
        console.log(estPair(nombre));
        alert(estPair(nombre));
    </script>
