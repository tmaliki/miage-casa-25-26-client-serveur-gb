<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 8 : Manipulation des attributs et dataset</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Exercice 8 : Manipulation des attributs et dataset</h1>
    <p>Dataset : c'est un moyen stocker des données personnalisées dans les elements HTML</p>

    <ul>
        <li data-price="10">Produit 1</li>
        <li data-price="20">Produit 2</li>
        <li data-price="30">Produit 3</li>
        <li data-price="40">Produit 4</li>
        <li data-price="50">Produit 5</li>
    </ul>

    <p>Prix du produit cliqué : <span id="price">0</span></p>
    <p>Cumul des prix de produits aux clics : <span id="cumul">0</span></p>

    <script src="./app.js"></script>
</body>
</html>
